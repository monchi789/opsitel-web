[project]
name = "backend-opsitel"
version = "0.1.0"
description = "Backend Project with FastAPI for union opsitel"
authors = [
    {name = "Cristian Monzon",email = "cristian-02-@live.com"}
]
requires-python = ">=3.12, <4.0.0"
dependencies = [
    "fastapi[standard] (>=0.135.1,<0.136.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "fastapi-pagination (>=0.15.10,<0.16.0)",
    "fastapi-filter (>=2.0.1,<3.0.0)",
]

[tool.poetry]
packages = [
    {include = "app"}
]

[tool.poetry.scripts]
dev = "app.main:start_dev"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
