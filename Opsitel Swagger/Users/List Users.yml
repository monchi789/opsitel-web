info:
  name: List Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/users/"
  params:
    - name: is_active
      value: "true"
      type: query
      disabled: true
    - name: role
      value: admin
      type: query
      disabled: true
    - name: name__ilike
      value: maria
      type: query
      disabled: true
    - name: email__ilike
      value: maria@example.com
      type: query
      disabled: true
    - name: last_name__ilike
      value: monzon
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
